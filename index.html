<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Cupboard Configurator</title>
  <link rel="preload" href="Twin%20Bench.glb" as="fetch" crossorigin>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; flex-direction: column; align-items: center; 
      justify-content: center; min-height: 100vh; margin: 0; background: #fbfbfb;
      padding: 20px; box-sizing: border-box;
    }
    model-viewer { width: 100%; height: 55vh; background: #ffffff; border-radius: 12px; }
    
    .viewer-wrap { position: relative; width: 100%; max-width: 1100px; }
    .viewer-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
      border-radius: 12px; font-weight: 600; color: #333; z-index: 3;
    }

    .view-controls {
      position: absolute; top: 12px; right: 12px; z-index: 6;
      display: flex; flex-direction: column; gap: 8px;
      background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .view-controls button {
      padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #ddd;
      background: white; cursor: pointer;
    }
    .view-controls .row { display:flex; gap:8px; }

    .configurator-panel {
      margin-top: 16px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 500px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row-title { font-weight: 600; min-width: 100px; color: #333; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    button { 
      padding: 10px 16px; font-size: 14px; cursor: pointer; 
      border-radius: 6px; border: 1px solid #ccc; background: white; transition: all 0.15s;
    }
    button.active { 
      background: #0076ff; color: white; border-color: #0076ff; font-weight: bold;
    }

    /* Modal styles for embedded Wix form */
    #form-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); z-index: 9999; }
    #form-modal-card { width: 92%; max-width: 960px; height: 86%; background: #fff; border-radius: 10px; overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    #form-modal-close { position: absolute; right: 12px; top: 12px; z-index: 5; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
    #form-modal-spinner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6)); z-index: 2; }
    #form-modal-iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>

  <div class="viewer-wrap">
    <model-viewer 
      id="cupboard-viewer" 
      src="Twin%20Bench.glb" 
      camera-controls
      style="width:100%; height:55vh; visibility:hidden; opacity:0; transition:opacity .25s; border-radius:12px;">
    </model-viewer>

    <div class="view-controls" id="view-controls">
      <div class="row">
        <button data-rotate="left">Rotate Left</button>
        <button data-rotate="right">Rotate Right</button>
      </div>
    </div>

    <div id="viewer-spinner" class="viewer-overlay">Loading model…</div>
  </div>

  <div class="configurator-panel">
    <div class="row">
      <span class="row-title">Model:</span>
      <div class="btn-group">
        <button class="size-btn" data-size="Ewe.glb">Ewe</button>
        <button class="size-btn active" data-size="Twin%20Bench.glb">Twin-bench</button>
        <button class="size-btn" data-size="Belted%20Ewe.glb">Belted Ewe</button>
      </div>
    </div>

    <div class="row">
      <span class="row-title">Doors:</span>
      <div class="btn-group">
        <button class="door-btn active" data-door="Green">Green</button>
        <button class="door-btn" data-door="Blue">Blue</button>
        <button class="door-btn" data-door="Black">Black</button>
        <button class="door-btn" data-door="Cream">Cream</button>
      </div>
    </div>

    <div class="row">
      <span class="row-title">Contact:</span>
      <div class="btn-group">
        <button id="request-quote-btn">Request quote</button>
      </div>
    </div>
  </div>

  <!-- Modal for embedding the Wix form -->
  <div id="form-modal" role="dialog" aria-modal="true">
    <div id="form-modal-card">
      <button id="form-modal-close" aria-label="Close form">Close</button>
      <div id="form-modal-spinner">Loading form…</div>
      <iframe id="form-modal-iframe" src="" frameborder="0" title="Quote form"></iframe>
    </div>
  </div>

  <script>
    const modelViewer = document.querySelector("#cupboard-viewer");
    const spinner = document.querySelector("#viewer-spinner");
    const viewControls = document.querySelector("#view-controls");

    let selectedModel = "Twin%20Bench.glb";
    let selectedDoor = "Green";

    const MODEL_DEFAULT_ORBIT = {
      'Twin%20Bench.glb': '135deg 75deg auto',
      'Ewe.glb': '315deg 75deg auto',
      'Belted%20Ewe.glb': '315deg 75deg auto'
    };

    const ROTATION_STEP = 45;
    const DEFAULT_ORBIT = MODEL_DEFAULT_ORBIT[selectedModel];

    let initialLoadDone = false;
    let userHasManualView = false;
    let savedOrbitToRestore = null;

    function showViewer() {
      spinner.style.display = "none";
      modelViewer.style.visibility = "visible";
      modelViewer.style.opacity = "1";
    }

    function showSpinnerMessage(msg) {
      spinner.style.display = "flex";
      spinner.textContent = msg;
      modelViewer.style.visibility = "hidden";
      modelViewer.style.opacity = "0";
    }

    showSpinnerMessage("Loading model…");

    function applyVariant(name) {
      try {
        if (typeof modelViewer.variantName !== "undefined") {
          modelViewer.variantName = name;
        }
      } catch (err) {
        console.warn("Error applying variant:", err);
      }
    }

    function getOrbitFromString(orbitString) {
      try {
        const parts = orbitString.trim().split(/\s+/);
        if (parts.length < 3) return null;
        const match = parts[0].match(/(-?[0-9.]+)deg/);
        return match ? parseFloat(match[1]) : null;
      } catch (err) {
        return null;
      }
    }

    function rotateBy(deg) {
      try {
        const orbit = modelViewer.cameraOrbit || DEFAULT_ORBIT || '135deg 75deg auto';
        const parts = orbit.trim().split(/\s+/);
        if (parts.length < 3) return;

        const azMatch = parts[0].match(/(-?[0-9.]+)deg/);
        if (!azMatch) return;

        let azValue = parseFloat(azMatch[1]);
        azValue = (azValue + deg) % 360;
        if (azValue < 0) azValue += 360;

        modelViewer.cameraOrbit = `${azValue}deg ${parts[1]} ${parts[2]}`;
        userHasManualView = true;
        savedOrbitToRestore = modelViewer.cameraOrbit;
      } catch (err) {
        console.warn("rotateBy error:", err);
      }
    }

    function setModelFile(fileName) {
      const orbitToUse = userHasManualView && savedOrbitToRestore
        ? savedOrbitToRestore
        : (MODEL_DEFAULT_ORBIT[fileName] || DEFAULT_ORBIT || "135deg 75deg auto");

      try {
        modelViewer.cameraOrbit = orbitToUse;
      } catch (err) { }

      modelViewer.setAttribute("src", fileName);
    }

    modelViewer.addEventListener("load", () => {
      if (!initialLoadDone) {
        modelViewer.cameraOrbit = MODEL_DEFAULT_ORBIT[selectedModel] || DEFAULT_ORBIT;
        initialLoadDone = true;
      }
      applyVariant(selectedDoor);
      showViewer();
    }, { once: true });

    let retryCount = 0;
    modelViewer.addEventListener("error", (ev) => {
      console.error("model-viewer error event:", ev);
      if (retryCount < 3) {
        retryCount++;
        showSpinnerMessage(`Model failed to load — retrying (${retryCount}/3)…`);
        setTimeout(() => {
          const src = modelViewer.getAttribute("src");
          modelViewer.removeAttribute("src");
          setTimeout(() => modelViewer.setAttribute("src", src), 50);
        }, 900 * retryCount);
      } else {
        showSpinnerMessage("Model failed to load. Check network or upload the GLB.");
      }
    });

    function updateConfigurator() {
      const targetFileUrl = selectedModel;
      const targetVariantName = `${selectedDoor}`;
      const currentSrcAttr = modelViewer.getAttribute("src");

      if (currentSrcAttr !== targetFileUrl) {
        showSpinnerMessage("Loading model…");
        setModelFile(targetFileUrl);

        modelViewer.addEventListener("load", () => {
          if (userHasManualView && savedOrbitToRestore) {
            try {
              modelViewer.cameraOrbit = savedOrbitToRestore;
            } catch (err) { }
          } else {
            try {
              modelViewer.cameraOrbit = MODEL_DEFAULT_ORBIT[targetFileUrl] || DEFAULT_ORBIT;
            } catch (err) { }
          }

          applyVariant(targetVariantName);
          showViewer();
        }, { once: true });
      } else {
        applyVariant(targetVariantName);
      }
    }

    document.querySelectorAll(".size-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".size-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedModel = e.target.getAttribute("data-size");

        if (userHasManualView) {
          try {
            savedOrbitToRestore = modelViewer.cameraOrbit || null;
          } catch (err) {
            savedOrbitToRestore = null;
          }
        } else {
          savedOrbitToRestore = null;
        }

        updateConfigurator();
      });
    });

    document.querySelectorAll(".door-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".door-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedDoor = e.target.getAttribute("data-door");
        updateConfigurator();
      });
    });

    viewControls.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-rotate]");
      if (!btn) return;
      const dir = btn.getAttribute("data-rotate");
      if (dir === "left") rotateBy(ROTATION_STEP);
      if (dir === "right") rotateBy(-ROTATION_STEP);
    });

    modelViewer.addEventListener("camera-change", () => {
      try {
        userHasManualView = true;
        savedOrbitToRestore = modelViewer.cameraOrbit;
      } catch (err) { }
    });

    // Map model filename strings -> Wix form page URL (Ewe & Belted provided)
    const WIX_FORM_URLS = {
      'Ewe.glb': 'https://blacksheepcampers.wixforms.com/f/7516869375056413788',
      'Twin%20Bench.glb': 'https://blacksheepcampers.wixforms.com/f/7516871135326110811',
      'Belted%20Ewe.glb': 'https://blacksheepcampers.wixforms.com/f/7516871286258140321'
    };

    // Modal elements
    const modal = document.getElementById('form-modal');
    const modalIframe = document.getElementById('form-modal-iframe');
    const modalSpinner = document.getElementById('form-modal-spinner');
    const modalClose = document.getElementById('form-modal-close');

    async function openFormOverlay(url) {
      modalIframe.src = '';
      modalSpinner.style.display = 'flex';
      modal.style.display = 'flex';

      let didLoad = false;
      const loadPromise = new Promise((resolve) => {
        modalIframe.onload = () => {
          didLoad = true;
          modalSpinner.style.display = 'none';
          resolve(true);
        };
        modalIframe.onerror = () => {
          didLoad = false;
          resolve(false);
        };
      });

      modalIframe.src = url;

      const winner = await Promise.race([
        loadPromise,
        new Promise((res) => setTimeout(() => res(false), 3500))
      ]);

      if (!winner || !didLoad) {
        modal.style.display = 'none';
        modalIframe.src = '';
        window.open(url, '_blank');
        alert('The form could not be embedded in this page, so it has been opened in a new tab instead.');
      }
    }

    modalClose.addEventListener('click', () => {
      modal.style.display = 'none';
      modalIframe.src = '';
    });

    document.getElementById('request-quote-btn').addEventListener('click', () => {
      const modelKey = selectedModel || '';
      const target = WIX_FORM_URLS[modelKey] || WIX_FORM_URLS['Twin%20Bench.glb'];
      openFormOverlay(target);
    });
  </script>

</body>
</html>
