<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Cupboard Configurator</title>
  <!-- Preload the default model to reduce initial latency -->
  <link rel="preload" href="Twin%20Bench.glb" as="fetch" crossorigin>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; flex-direction: column; align-items: center; 
      justify-content: center; min-height: 100vh; margin: 0; background: #fbfbfb;
      padding: 20px; box-sizing: border-box;
    }
    model-viewer { width: 100%; height: 55vh; background: #ffffff; border-radius: 12px; }
    
    .configurator-panel {
      margin-top: 24px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 500px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row-title { font-weight: 600; min-width: 100px; color: #333; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Simple overlay styles for loading / error state */
    .viewer-wrap { position: relative; width: 100%; }
    .viewer-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
      border-radius: 12px; font-weight: 600; color: #333; z-index: 3;
    }
    .spinner-dot { width:10px; height:10px; border-radius:50%; background:#0076ff; margin:0 4px; animation:spin 1s infinite; }
    @keyframes spin { 0% { transform: translateY(0);} 50% { transform: translateY(-6px);} 100% { transform: translateY(0);} }
    
    button { 
      padding: 10px 16px; font-size: 14px; cursor: pointer; 
      border-radius: 6px; border: 1px solid #ccc; background: white; transition: all 0.2s;
    }
    button.active { 
      background: #0076ff; color: white; border-color: #0076ff; font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- The 3D View Canvas (Starts with the Twin Bench file) -->
  <div class="viewer-wrap">
    <model-viewer 
      id="cupboard-viewer" 
      src="Twin%20Bench.glb" 
      camera-controls
      style="width:100%; height:55vh; visibility:hidden; opacity:0; transition:opacity .25s; border-radius:12px;">
    </model-viewer>

    <!-- Loading / Error overlay -->
    <div id="viewer-spinner" class="viewer-overlay">Loading model…</div>
  </div>

  <div class="configurator-panel">
    <!-- ROW 1: Models (Ewe / Twin-bench / Belted Ewe) -->
    <div class="row">
      <span class="row-title">Model:</span>
      <div class="btn-group">
        <!-- data-size holds the exact filename we'll set on the model-viewer src -->
        <button class="size-btn" data-size="Ewe.glb">Ewe</button>
        <button class="size-btn active" data-size="Twin%20Bench.glb">Twin-bench</button>
        <button class="size-btn" data-size="Belted%20Ewe.glb">Belted Ewe</button>
      </div>
    </div>

    <!-- ROW 2: Door Colours (Changes internal GLB Variant) -->
    <div class="row">
      <span class="row-title">Doors:</span>
      <div class="btn-group">
        <button class="door-btn active" data-door="Green">Green</button>
        <button class="door-btn" data-door="Blue">Blue</button>
        <button class="door-btn" data-door="Black">Black</button>
        <button class="door-btn" data-door="Cream">Cream</button>
      </div>
    </div>

  </div>

  <script>
    const modelViewer = document.querySelector("#cupboard-viewer");
    const spinner = document.querySelector("#viewer-spinner");

    // Track global configuration state
    // selectedModel holds the exact filename used as the model-viewer src
    let selectedModel = "Twin%20Bench.glb";
    let selectedDoor = "Green";

    // Desired camera orbit to face the model front. Tweak azimuth/elevation as needed.
    const FRONT_CAMERA_ORBIT = "135deg 75deg auto"; // azimuth elevation radius (auto keeps default distance)

    // Show/hide helpers for viewer and spinner
    function showViewer() {
      spinner.style.display = "none";
      modelViewer.style.visibility = "visible";
      modelViewer.style.opacity = "1";
    }
    function showSpinnerMessage(msg) {
      spinner.style.display = "flex";
      spinner.textContent = msg;
      modelViewer.style.visibility = "hidden";
      modelViewer.style.opacity = "0";
    }

    // Ensure initial spinner visible while the first model downloads
    showSpinnerMessage("Loading model…");

    // Apply variant safely (guard in case variantName isn't supported)
    function applyVariant(name) {
      try {
        if (typeof modelViewer.variantName !== "undefined") {
          modelViewer.variantName = name;
        }
      } catch (err) {
        console.warn("Error applying variant:", err);
      }
    }

    // Set the camera to face the front immediately (no animation)
    function setCameraToFrontInstant() {
      try {
        modelViewer.cameraOrbit = FRONT_CAMERA_ORBIT;
        // jumpCameraToGoal moves the camera instantly to the set orbit
        if (typeof modelViewer.jumpCameraToGoal === 'function') {
          modelViewer.jumpCameraToGoal();
        }
      } catch (err) {
        console.warn("Error setting camera orbit:", err);
      }
    }

    // Global retry counter for model loads
    let retryCount = 0;

    // When the model finishes loading, set camera to front, apply variant, and show it
    modelViewer.addEventListener("load", () => {
      setCameraToFrontInstant();
      applyVariant(selectedDoor);
      showViewer();
      retryCount = 0; // reset retries on success
    }, { once: true });

    // Error handler: retry a few times with backoff, then show message
    modelViewer.addEventListener("error", (ev) => {
      console.error("model-viewer error event:", ev);
      if (retryCount < 3) {
        retryCount++;
        showSpinnerMessage(`Model failed to load — retrying (${retryCount}/3)…`);
        setTimeout(() => {
          const src = modelViewer.getAttribute("src");
          modelViewer.removeAttribute("src");
          setTimeout(() => modelViewer.setAttribute("src", src), 50);
        }, 900 * retryCount);
      } else {
        showSpinnerMessage("Model failed to load. Check network or upload the GLB.");
      }
    });

    function updateConfigurator() {
      // 1. targetFile is the filename (relative path) we want to load
      const targetFileUrl = selectedModel;
      // 2. Build the variant name (door color only)
      const targetVariantName = `${selectedDoor}`;

      // Normalize current src form (compare attribute to attribute so the comparison is consistent)
      const currentSrcAttr = modelViewer.getAttribute("src");

      // 3. If the model changed, update the source file first
      if (currentSrcAttr !== targetFileUrl) {
        // Show spinner while the new model downloads
        showSpinnerMessage("Loading model…");

        // Use setAttribute so getAttribute later returns the same relative string
        modelViewer.setAttribute("src", targetFileUrl);

        // Wait for the new model to finish downloading before setting its color variant
        modelViewer.addEventListener("load", () => {
          // When a new model loads, also set camera front so viewers see the front immediately
          setCameraToFrontInstant();
          applyVariant(targetVariantName);
          showViewer();
        }, { once: true });
      } else {
        // If the model didn't change, just update the color variant instantly
        applyVariant(targetVariantName);
      }
    }

    // Handle Model Buttons
    document.querySelectorAll(".size-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".size-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedModel = e.target.getAttribute("data-size");
        updateConfigurator();
      });
    });

    // Handle Door Buttons
    document.querySelectorAll(".door-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".door-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedDoor = e.target.getAttribute("data-door");
        updateConfigurator();
      });
    });
  </script>

</body>
</html>
