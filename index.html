<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Cupboard Configurator</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; flex-direction: column; align-items: center; 
      justify-content: center; min-height: 100vh; margin: 0; background: #fbfbfb;
      padding: 20px; box-sizing: border-box;
    }
    model-viewer { width: 100%; height: 55vh; background: #ffffff; border-radius: 12px; }
    
    .configurator-panel {
      margin-top: 24px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 500px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row-title { font-weight: 600; min-width: 100px; color: #333; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    
    button { 
      padding: 10px 16px; font-size: 14px; cursor: pointer; 
      border-radius: 6px; border: 1px solid #ccc; background: white; transition: all 0.2s;
    }
    button.active { 
      background: #0076ff; color: white; border-color: #0076ff; font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- The 3D View Canvas (Starts with the Twin Bench file) -->
  <model-viewer 
    id="cupboard-viewer" 
    src="Twin%20Bench.glb" 
    camera-controls>
  </model-viewer>

  <div class="configurator-panel">
    <!-- ROW 1: Models (Ewe / Twin-bench / Belted Ewe) -->
    <div class="row">
      <span class="row-title">Model:</span>
      <div class="btn-group">
        <!-- data-size holds the exact filename we'll set on the model-viewer src -->
        <button class="size-btn" data-size="Ewe.glb">Ewe</button>
        <button class="size-btn active" data-size="Twin%20Bench.glb">Twin-bench</button>
        <button class="size-btn" data-size="Belted%20Ewe.glb">Belted Ewe</button>
      </div>
    </div>

    <!-- ROW 2: Door Colours (Changes internal GLB Variant) -->
    <div class="row">
      <span class="row-title">Doors:</span>
      <div class="btn-group">
        <button class="door-btn active" data-door="Green">Green</button>
        <button class="door-btn" data-door="Blue">Blue</button>
        <button class="door-btn" data-door="Black">Black</button>
        <button class="door-btn" data-door="Cream">Cream</button>
      </div>
    </div>

    <!-- ROW 3: Worktop Materials (Changes internal GLB Variant) -->
    <div class="row">
      <span class="row-title">Worktop:</span>
      <div class="btn-group">
        <button class="worktop-btn active" data-worktop="Oak">Oak</button>
        <button class="worktop-btn" data-worktop="Birch">Birch</button>
      </div>
    </div>
  </div>

  <script>
    const modelViewer = document.querySelector("#cupboard-viewer");
    
    // Track global configuration state
    // selectedModel holds the exact filename used as the model-viewer src
    let selectedModel = "Twin%20Bench.glb";
    let selectedDoor = "Green";
    let selectedWorktop = "Oak";

    function updateConfigurator() {
      // 1. targetFile is the filename (relative path) we want to load
      const targetFileUrl = selectedModel;
      // 2. Build the combination variant string (e.g. "Green_Oak")
      const targetVariantName = `${selectedDoor}_${selectedWorktop}`;

      // Normalize current src form (compare attribute to attribute so the comparison is consistent)
      const currentSrcAttr = modelViewer.getAttribute("src");

      // 3. If the model changed, update the source file first
      if (currentSrcAttr !== targetFileUrl) {
        // Use setAttribute so getAttribute later returns the same relative string
        modelViewer.setAttribute("src", targetFileUrl);

        // Wait for the new model to finish downloading before setting its color variant
        modelViewer.addEventListener("load", () => {
          if (typeof modelViewer.variantName !== "undefined") {
            modelViewer.variantName = targetVariantName;
          } else {
            console.warn("model-viewer variantName not available; ensure your GLB has variants named:", targetVariantName);
          }
        }, { once: true });
      } else {
        // If the model didn't change, just update the color variant instantly
        modelViewer.variantName = targetVariantName;
      }
    }

    // Handle Model Buttons
    document.querySelectorAll(".size-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".size-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedModel = e.target.getAttribute("data-size");
        updateConfigurator();
      });
    });

    // Handle Door Buttons
    document.querySelectorAll(".door-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".door-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedDoor = e.target.getAttribute("data-door");
        updateConfigurator();
      });
    });

    // Handle Worktop Buttons
    document.querySelectorAll(".worktop-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".worktop-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedWorktop = e.target.getAttribute("data-worktop");
        updateConfigurator();
      });
    });

    // Optional: log model-viewer errors to console to make debugging easier
    modelViewer.addEventListener("error", (ev) => {
      console.error("model-viewer error event:", ev);
    });
  </script>

</body>
</html>
