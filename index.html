<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Cupboard Configurator</title>
  <link rel="preload" href="Twin%20Bench.glb" as="fetch" crossorigin>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; flex-direction: column; align-items: center; 
      justify-content: center; min-height: 100vh; margin: 0; background: #fbfbfb;
      padding: 20px; box-sizing: border-box;
    }
    model-viewer { width: 100%; height: 55vh; background: #ffffff; border-radius: 12px; }
    
    .viewer-wrap { position: relative; width: 100%; max-width: 1100px; }
    .viewer-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
      border-radius: 12px; font-weight: 600; color: #333; z-index: 3;
    }

    .view-controls {
      position: absolute; top: 12px; right: 12px; z-index: 6;
      display: flex; flex-direction: column; gap: 8px;
      background: rgba(255,255,255,0.9); padding: 8px; border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .view-controls button {
      padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #ddd;
      background: white; cursor: pointer;
    }
    .view-controls .row { display:flex; gap:8px; }

    .configurator-panel {
      margin-top: 16px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 500px;
    }
    .row { display: flex; gap: 10px; align-items: center; }
    .row-title { font-weight: 600; min-width: 100px; color: #333; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    button { 
      padding: 10px 16px; font-size: 14px; cursor: pointer; 
      border-radius: 6px; border: 1px solid #ccc; background: white; transition: all 0.15s;
    }
    button.active { 
      background: #0076ff; color: white; border-color: #0076ff; font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="viewer-wrap">
    <model-viewer 
      id="cupboard-viewer" 
      src="Twin%20Bench.glb" 
      camera-controls
      style="width:100%; height:55vh; visibility:hidden; opacity:0; transition:opacity .25s; border-radius:12px;">
    </model-viewer>

    <div class="view-controls" id="view-controls">
      <div class="row">
        <button data-view="front">Front</button>
        <button data-view="back">Back</button>
      </div>
      <div class="row">
        <button data-view="left">Left</button>
        <button data-view="right">Right</button>
      </div>
      <div class="row">
        <button data-view="top">Top</button>
      </div>
    </div>

    <div id="viewer-spinner" class="viewer-overlay">Loading model…</div>
  </div>

  <div class="configurator-panel">
    <div class="row">
      <span class="row-title">Model:</span>
      <div class="btn-group">
        <button class="size-btn" data-size="Ewe.glb">Ewe</button>
        <button class="size-btn active" data-size="Twin%20Bench.glb">Twin-bench</button>
        <button class="size-btn" data-size="Belted%20Ewe.glb">Belted Ewe</button>
      </div>
    </div>

    <div class="row">
      <span class="row-title">Doors:</span>
      <div class="btn-group">
        <button class="door-btn active" data-door="Green">Green</button>
        <button class="door-btn" data-door="Blue">Blue</button>
        <button class="door-btn" data-door="Black">Black</button>
        <button class="door-btn" data-door="Cream">Cream</button>
      </div>
    </div>
  </div>

  <script>
    const modelViewer = document.querySelector("#cupboard-viewer");
    const spinner = document.querySelector("#viewer-spinner");
    const viewControls = document.querySelector("#view-controls");

    let selectedModel = "Twin%20Bench.glb";
    let selectedDoor = "Green";

    const FRONT_CAMERA_ORBIT = "135deg 75deg auto";

    let initialLoadDone = false;
    let savedOrbitToRestore = null;

    function showViewer() {
      spinner.style.display = "none";
      modelViewer.style.visibility = "visible";
      modelViewer.style.opacity = "1";
    }
    function showSpinnerMessage(msg) {
      spinner.style.display = "flex";
      spinner.textContent = msg;
      modelViewer.style.visibility = "hidden";
      modelViewer.style.opacity = "0";
    }

    showSpinnerMessage("Loading model…");

    function applyVariant(name) {
      try {
        if (typeof modelViewer.variantName !== "undefined") {
          modelViewer.variantName = name;
        }
      } catch (err) {
        console.warn("Error applying variant:", err);
      }
    }

    function jumpToOrbit(orbitString) {
      try {
        modelViewer.cameraOrbit = orbitString;
        if (typeof modelViewer.jumpCameraToGoal === 'function') {
          modelViewer.jumpCameraToGoal();
        }
      } catch (err) {
        console.warn("Error jumping camera to orbit:", err);
      }
    }

    modelViewer.addEventListener("load", () => {
      if (!initialLoadDone) {
        jumpToOrbit(FRONT_CAMERA_ORBIT);
        initialLoadDone = true;
      }
      applyVariant(selectedDoor);
      showViewer();
    }, { once: true });

    let retryCount = 0;
    modelViewer.addEventListener("error", (ev) => {
      console.error("model-viewer error event:", ev);
      if (retryCount < 3) {
        retryCount++;
        showSpinnerMessage(`Model failed to load — retrying (${retryCount}/3)…`);
        setTimeout(() => {
          const src = modelViewer.getAttribute("src");
          modelViewer.removeAttribute("src");
          setTimeout(() => modelViewer.setAttribute("src", src), 50);
        }, 900 * retryCount);
      } else {
        showSpinnerMessage("Model failed to load. Check network or upload the GLB.");
      }
    });

    function updateConfigurator() {
      const targetFileUrl = selectedModel;
      const targetVariantName = `${selectedDoor}`;
      const currentSrcAttr = modelViewer.getAttribute("src");

      if (currentSrcAttr !== targetFileUrl) {
        try {
          savedOrbitToRestore = modelViewer.cameraOrbit || null;
        } catch (err) {
          savedOrbitToRestore = null;
        }

        showSpinnerMessage("Loading model…");
        modelViewer.setAttribute("src", targetFileUrl);

        modelViewer.addEventListener("load", () => {
          if (savedOrbitToRestore) {
            jumpToOrbit(savedOrbitToRestore);
            savedOrbitToRestore = null;
          }
          applyVariant(targetVariantName);
          showViewer();
        }, { once: true });
      } else {
        applyVariant(targetVariantName);
      }
    }

    document.querySelectorAll(".size-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".size-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedModel = e.target.getAttribute("data-size");
        updateConfigurator();
      });
    });

    document.querySelectorAll(".door-btn").forEach(button => {
      button.addEventListener("click", (e) => {
        document.querySelectorAll(".door-btn").forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");
        selectedDoor = e.target.getAttribute("data-door");
        updateConfigurator();
      });
    });

    const PRESETS = {
      front: "0deg 75deg auto",
      back: "180deg 75deg auto",
      left: "90deg 75deg auto",
      right: "270deg 75deg auto",
      top: "0deg 90deg auto"
    };

    viewControls.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-view]");
      if (!btn) return;
      const view = btn.getAttribute("data-view");
      const orbit = PRESETS[view];
      if (orbit) {
        jumpToOrbit(orbit);
      }
    });

    modelViewer.addEventListener("camera-change", () => {
      try {
        savedOrbitToRestore = modelViewer.cameraOrbit;
      } catch (err) { }
    });
  </script>

</body>
</html>
