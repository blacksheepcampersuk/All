
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    />

    <title>Complete Cupboard Configurator</title>

    <!-- Model Viewer: CORS-friendly CDN -->
    <script
        type="module"
        crossorigin
        src="https://cdn.jsdelivr.net/npm/@google/model-viewer@1.14.1/dist/model-viewer.min.js"
    ></script>

    <style>
        /* ==============================
           Global Styles
        ============================== */

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background: #fbfbfb;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* ==============================
           Tabs
        ============================== */

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .tab.active {
            background: #0076ff;
            color: #fff;
            border-color: #0076ff;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* ==============================
           3D Viewer
        ============================== */

        .viewer-wrap {
            position: relative;
            width: 100%;
        }

        model-viewer {
            display: block;
            width: 100%;
            height: 55vh;
            background: #fff;
            border-radius: 12px;
        }

        .viewer-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.9),
                rgba(255, 255, 255, 0.6)
            );

            border-radius: 12px;
            font-weight: 600;
            color: #333;
        }

        /* Viewer Controls */

        .view-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 6;

            display: flex;
            gap: 8px;

            padding: 8px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .view-controls button {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        /* ==============================
           Configurator Panel
        ============================== */

        .configurator-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;

            width: 100%;
            max-width: 500px;
            margin-top: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .row-title {
            min-width: 100px;
            font-weight: 600;
            color: #333;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button.option {
            padding: 10px 16px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        button.option.active {
            background: #0076ff;
            color: #fff;
            border-color: #0076ff;
            font-weight: 700;
        }

        /* ==============================
           Form Modal
        ============================== */

        #form-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.6);
        }

        #form-modal-card {
            position: relative;
            width: 92%;
            max-width: 960px;
            height: 86%;

            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Modal Close Button */

        #form-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;

            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        /* Modal Loading Spinner */

        #form-modal-spinner {
            position: absolute;
            inset: 0;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.9),
                rgba(255, 255, 255, 0.6)
            );
        }

        /* Modal Iframe */

        #form-modal-iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- ==============================
             Navigation Tabs
        ============================== -->

        <div class="tabs" role="tablist">
            <button
                id="tab-photo"
                class="tab active"
                data-target="panel-photo"
                role="tab"
                aria-selected="true"
            >
                Photo
            </button>

            <button
                id="tab-3d"
                class="tab"
                data-target="panel-3d"
                role="tab"
                aria-selected="false"
            >
                3D Viewer
            </button>
        </div>
<div id="panel-photo" class="tab-panel active">
  <!-- Put your photo content here -->
  <div style="background:#fff;padding:20px;border-radius:12px;">
    <h2>Product Photos</h2>
    <p>Replace this with your photo gallery or content. Click the 3D tab to view the model.</p>
  </div>
</div>

<div id="panel-3d" class="tab-panel" aria-hidden="true">
  <div class="viewer-wrap" style="margin-bottom:12px;">
    <model-viewer id="cupboard-viewer" src="./models/Twin-Bench.glb" camera-controls ar ar-modes="webxr scene-viewer quick-look" style="width:100%; height:55vh; visibility:hidden; opacity:0; transition:opacity .25s; border-radius:12px;"></model-viewer>

    <div class="view-controls" id="view-controls">
      <button data-rotate="left" title="Rotate left">⟲</button>
      <button data-rotate="right" title="Rotate right">⟳</button>
    </div>

    <div id="viewer-spinner" class="viewer-overlay">Loading model…</div>
  </div>
</div>

<div class="configurator-panel">
  <div class="row">
    <span class="row-title">Model:</span>
    <div class="btn-group">
      <button class="option size-btn" data-size="./models/Ewe.glb">Ewe</button>
      <button class="option size-btn active" data-size="./models/Twin-Bench.glb">Twin-bench</button>
      <button class="option size-btn" data-size="./models/Belted-Ewe.glb">Belted Ewe</button>
    </div>
  </div>

  <div class="row">
    <span class="row-title">Doors:</span>
    <div class="btn-group">
      <button class="option door-btn active" data-door="Green">Green</button>
      <button class="option door-btn" data-door="Blue">Blue</button>
      <button class="option door-btn" data-door="Black">Black</button>
      <button class="option door-btn" data-door="Cream">Cream</button>
    </div>
  </div>

  <div class="row">
    <span class="row-title">Contact:</span>
    <div class="btn-group">
      <button id="request-quote-btn" class="option">Request quote</button>
    </div>
  </div>
</div>

<!-- Modal for form -->
<div id="form-modal" role="dialog" aria-modal="true">
  <div id="form-modal-card">
    <button id="form-modal-close" aria-label="Close form">Close</button>
    <div id="form-modal-spinner">Loading form…</div>
    <iframe id="form-modal-iframe" src="" frameborder="0" title="Quote form"></iframe>
  </div>
</div>
        <!-- Continue with the remaining HTML here -->

<script>
  // =========================================================
  // 1. TAB NAVIGATION
  // =========================================================

  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.tab-panel');

  function showTabById(tabId) {
    const selectedTab = document.getElementById(tabId);

    if (!selectedTab) return;

    const targetPanelId = selectedTab.getAttribute('data-target');

    tabs.forEach((tab) => {
      tab.classList.toggle('active', tab.id === tabId);
    });

    panels.forEach((panel) => {
      const isActive = panel.id === targetPanelId;

      panel.classList.toggle('active', isActive);
      panel.setAttribute('aria-hidden', String(!isActive));
    });
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      showTabById(tab.id);
    });
  });

  function show3dTab() {
    showTabById('tab-3d');
  }


  // =========================================================
  // 2. 3D MODEL VIEWER INITIALIZATION
  // =========================================================

  const modelViewer = document.getElementById('cupboard-viewer');
  const spinner = document.getElementById('viewer-spinner');
  const viewControls = document.getElementById('view-controls');

  const MODEL_DEFAULT_ORBIT = {
    './models/Twin-Bench.glb': '135deg 75deg auto',
    './models/Ewe.glb': '315deg 75deg auto',
    './models/Belted-Ewe.glb': '315deg 75deg auto'
  };

  const DEFAULT_MODEL = './models/Twin-Bench.glb';
  const DEFAULT_DOOR = 'Green';
  const ROTATION_STEP = 45;
  const MAX_LOAD_RETRIES = 3;

  let selectedModel = DEFAULT_MODEL;
  let selectedDoor = DEFAULT_DOOR;

  let initialLoadDone = false;
  let userHasManualView = false;
  let savedOrbitToRestore = null;
  let retryCount = 0;


  // =========================================================
  // 3. VIEWER DISPLAY HELPERS
  // =========================================================

  function showViewer() {
    spinner.style.display = 'none';

    modelViewer.style.visibility = 'visible';
    modelViewer.style.opacity = '1';
  }

  function showSpinnerMessage(message) {
    spinner.style.display = 'flex';
    spinner.textContent = message;

    modelViewer.style.visibility = 'hidden';
    modelViewer.style.opacity = '0';
  }

  function applyVariant(variantName) {
    try {
      if (typeof modelViewer.variantName !== 'undefined') {
        modelViewer.variantName = variantName;
      }
    } catch (error) {
      console.warn('Unable to apply model variant:', error);
    }
  }

  function getModelOrbit(modelFile) {
    return (
      MODEL_DEFAULT_ORBIT[modelFile] ||
      MODEL_DEFAULT_ORBIT[DEFAULT_MODEL]
    );
  }


  // =========================================================
  // 4. MODEL LOADING
  // =========================================================

  function setModelFile(modelFile) {
    const defaultOrbit = getModelOrbit(modelFile);

    const orbitToUse =
      userHasManualView && savedOrbitToRestore
        ? savedOrbitToRestore
        : defaultOrbit;

    try {
      modelViewer.cameraOrbit = orbitToUse;
    } catch (error) {
      console.warn('Unable to set camera orbit:', error);
    }

    // Remove and reassign the source to force a model reload.
    modelViewer.removeAttribute('src');

    setTimeout(() => {
      modelViewer.setAttribute('src', modelFile);
    }, 50);
  }

  modelViewer.addEventListener('load', () => {
    if (!initialLoadDone) {
      try {
        modelViewer.cameraOrbit = getModelOrbit(selectedModel);
      } catch (error) {
        console.warn('Unable to set initial camera orbit:', error);
      }

      initialLoadDone = true;
    }

    // Reset retries after a successful load.
    retryCount = 0;

    applyVariant(selectedDoor);
    showViewer();
  });

  modelViewer.addEventListener('error', (event) => {
    console.error('Model viewer error:', event);

    if (retryCount >= MAX_LOAD_RETRIES) {
      showSpinnerMessage(
        'Model failed to load. Check your network connection or model file.'
      );

      return;
    }

    retryCount++;

    showSpinnerMessage(
      `Model failed to load — retrying (${retryCount}/${MAX_LOAD_RETRIES})…`
    );

    const retryDelay = 900 * retryCount;

    setTimeout(() => {
      const currentSource = modelViewer.getAttribute('src');

      modelViewer.removeAttribute('src');

      setTimeout(() => {
        if (currentSource) {
          modelViewer.setAttribute('src', currentSource);
        }
      }, 50);
    }, retryDelay);
  });

  // Display the initial loading message.
  showSpinnerMessage('Loading model…');


  // =========================================================
  // 5. MODEL SIZE SELECTION
  // =========================================================

  const sizeButtons = document.querySelectorAll('.size-btn');

  sizeButtons.forEach((button) => {
    button.addEventListener('click', (event) => {
      const clickedButton = event.currentTarget;

      // Update active button.
      sizeButtons.forEach((item) => {
        item.classList.remove('active');
      });

      clickedButton.classList.add('active');

      // Store selected model.
      selectedModel = clickedButton.getAttribute('data-size');

      // Preserve the user's current camera angle.
      try {
        savedOrbitToRestore = userHasManualView
          ? modelViewer.cameraOrbit
          : null;
      } catch (error) {
        savedOrbitToRestore = null;
      }

      // Switch to the 3D tab and reload the model.
      show3dTab();
      showSpinnerMessage('Loading model…');

      retryCount = 0;
      setModelFile(selectedModel);
    });
  });


  // =========================================================
  // 6. DOOR COLOUR / VARIANT SELECTION
  // =========================================================

  const doorButtons = document.querySelectorAll('.door-btn');

  doorButtons.forEach((button) => {
    button.addEventListener('click', (event) => {
      const clickedButton = event.currentTarget;

      // Update active button.
      doorButtons.forEach((item) => {
        item.classList.remove('active');
      });

      clickedButton.classList.add('active');

      // Apply the selected model variant.
      selectedDoor = clickedButton.getAttribute('data-door');

      applyVariant(selectedDoor);
    });
  });


  // =========================================================
  // 7. 3D CAMERA ROTATION CONTROLS
  // =========================================================

  viewControls.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-rotate]');

    if (!button) return;

    const direction = button.getAttribute('data-rotate');

    try {
      const currentOrbit =
        modelViewer.cameraOrbit ||
        getModelOrbit(selectedModel);

      const orbitParts = String(currentOrbit)
        .trim()
        .split(/\s+/);

      const currentAzimuth =
        parseFloat(orbitParts[0].match(/-?[0-9.]+/)?.[0]) || 0;

      const rotationDirection = direction === 'left' ? 1 : -1;

      let nextAzimuth =
        (currentAzimuth + rotationDirection * ROTATION_STEP) % 360;

      if (nextAzimuth < 0) {
        nextAzimuth += 360;
      }

      const polarAngle = orbitParts[1] || '75deg';
      const cameraRadius = orbitParts[2] || 'auto';

      modelViewer.cameraOrbit =
        `${nextAzimuth}deg ${polarAngle} ${cameraRadius}`;

      // Remember manual camera adjustments.
      userHasManualView = true;
      savedOrbitToRestore = modelViewer.cameraOrbit;

    } catch (error) {
      console.warn('Unable to rotate model:', error);
    }
  });


  // =========================================================
  // 8. WIX QUOTE FORM URLS
  // =========================================================

  const WIX_FORM_URLS = {
    './models/Ewe.glb':
      'https://blacksheepcampers.wixforms.com/f/7516869375056413788',

    './models/Twin-Bench.glb':
      'https://blacksheepcampers.wixforms.com/f/7516871135326110811',

    './models/Belted-Ewe.glb':
      'https://blacksheepcampers.wixforms.com/f/7516871286258140321'
  };


  // =========================================================
  // 9. QUOTE FORM MODAL ELEMENTS
  // =========================================================

  const modal = document.getElementById('form-modal');
  const modalIframe = document.getElementById('form-modal-iframe');
  const modalSpinner = document.getElementById('form-modal-spinner');
  const modalClose = document.getElementById('form-modal-close');

  const quoteButton = document.getElementById('request-quote-btn');


  // =========================================================
  // 10. OPEN WIX FORM
  // =========================================================

  async function openFormOverlay(url) {
    modalIframe.src = '';
    modalSpinner.style.display = 'flex';
    modal.style.display = 'flex';

    let didLoad = false;

    const loadPromise = new Promise((resolve) => {
      modalIframe.onload = () => {
        didLoad = true;
        modalSpinner.style.display = 'none';

        resolve(true);
      };

      modalIframe.onerror = () => {
        didLoad = false;

        resolve(false);
      };
    });

    modalIframe.src = url;

    // Wait for the iframe or the timeout, whichever comes first.
    const didLoadInTime = await Promise.race([
      loadPromise,
      new Promise((resolve) => {
        setTimeout(() => resolve(false), 3500);
      })
    ]);

    if (!didLoadInTime || !didLoad) {
      modal.style.display = 'none';
      modalIframe.src = '';

      window.open(url, '_blank');

      alert(
        'The form could not be embedded in this page, ' +
        'so it has been opened in a new tab instead.'
      );
    }
  }


  // =========================================================
  // 11. CLOSE WIX FORM MODAL
  // =========================================================

  modalClose.addEventListener('click', () => {
    modal.style.display = 'none';
    modalIframe.src = '';
  });


  // =========================================================
  // 12. REQUEST A QUOTE
  // =========================================================

  quoteButton.addEventListener('click', () => {
    const modelKey = selectedModel || DEFAULT_MODEL;

    const formUrl =
      WIX_FORM_URLS[modelKey] ||
      WIX_FORM_URLS[DEFAULT_MODEL];

    openFormOverlay(formUrl);
  });

</script>
</body>
</html>
